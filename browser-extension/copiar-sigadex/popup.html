<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Copiar documento formatado</title>
<style>
  body {
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    width: 280px;
    padding: 14px;
    margin: 0;
  }
  h1 {
    font-size: 13px;
    font-weight: 700;
    margin: 0 0 8px;
    color: #0f172a;
  }
  p.hint {
    font-size: 11px;
    color: #64748b;
    margin: 0 0 12px;
    line-height: 1.5;
  }
  button {
    width: 100%;
    padding: 10px;
    font-size: 13px;
    font-weight: 600;
    border-radius: 8px;
    border: none;
    background: #0f172a;
    color: white;
    cursor: pointer;
  }
  button:hover {
    background: #1e293b;
  }
  button:disabled {
    opacity: 0.6;
    cursor: default;
  }
  #status {
    margin-top: 10px;
    font-size: 12px;
    min-height: 32px;
    line-height: 1.4;
    color: #334155;
  }
  #status.erro {
    color: #b91c1c;
  }
  #status.ok {
    color: #047857;
    font-weight: 600;
  }
</style>
</head>
<body>
  <h1>Copiar documento formatado</h1>
  <p class="hint">
    Abra o documento no SIGADEX (ou outro visualizador em PDF.js) e clique no
    botão abaixo. O texto corrigido (com os espaços de quebra de linha
    restaurados) vai para a área de transferência.
  </p>
  <button id="btn-copiar">Copiar documento formatado</button>
  <div id="status"></div>
  <script src="extrator.js"></script>
  <script src="popup.js"></script>
</body>
</html>
